[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualsync"
version = "1.2.0"
description = "Windows multi-endpoint WASAPI audio synchronizer"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "PyAudioWPatch>=0.2.12.7,<0.3",
  "PySide6>=6.8,<7",
  "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6.11,<7", "ruff>=0.8,<1"]

[project.scripts]
dualsync = "dualsync.main:main"

[tool.setuptools.packages.find]
include = ["dualsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
